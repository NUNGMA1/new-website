<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카니보어 — 오늘의 식단</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <span class="logo">🥩 카니보어</span>
        <div class="header-right">
          <span class="logged-in-user hidden" id="loggedInUser"></span>
          <button class="btn-logout hidden" id="btnLogout">로그아웃</button>
          <button class="btn-record" id="openModal">+ 오늘 기록하기</button>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <div class="today-date" id="todayDate"></div>
      <h1>오늘의 카니보어</h1>
      <p class="hero-sub" id="totalCount">불러오는 중...</p>
    </div>
  </section>

  <!-- FEED -->
  <main class="main">
    <div class="container">
      <div class="feed" id="feed">
        <div class="loading">🥩 식단 불러오는 중...</div>
      </div>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="closeModal">✕</button>

      <!-- Step 1: 로그인 -->
      <div class="modal-step" id="stepLogin">
        <h2>오늘 기록하기</h2>
        <p class="step-desc">아이디와 비밀번호를 입력하세요.<br/>처음이면 자동으로 계정이 만들어져요.</p>
        <div class="form-group">
          <input type="text" id="inputUsername" placeholder="아이디" autocomplete="off" maxlength="20" />
        </div>
        <div class="form-group">
          <input type="password" id="inputPassword" placeholder="비밀번호" maxlength="30" />
        </div>
        <div class="error-msg hidden" id="loginError"></div>
        <button class="btn-primary" id="btnLogin">다음 →</button>
      </div>

      <!-- Step 2: 식단 입력 -->
      <div class="modal-step hidden" id="stepMeal">
        <h2>안녕하세요, <span id="greetUsername"></span>님!</h2>
        <p class="step-desc">오늘 뭐 드셨나요? 빈 칸은 비워도 돼요.</p>
        <div class="meal-inputs">
          <div class="meal-row">
            <span class="meal-label">🌅 아침</span>
            <div class="tag-input-box" id="boxBreakfast">
              <input type="text" class="tag-input" data-meal="breakfast" placeholder="입력 후 스페이스 또는 엔터" />
            </div>
          </div>
          <div class="meal-row">
            <span class="meal-label">☀️ 점심</span>
            <div class="tag-input-box" id="boxLunch">
              <input type="text" class="tag-input" data-meal="lunch" placeholder="입력 후 스페이스 또는 엔터" />
            </div>
          </div>
          <div class="meal-row">
            <span class="meal-label">🌙 저녁</span>
            <div class="tag-input-box" id="boxDinner">
              <input type="text" class="tag-input" data-meal="dinner" placeholder="입력 후 스페이스 또는 엔터" />
            </div>
          </div>
        </div>
        <div class="form-group" style="margin-top: 8px;">
          <input type="text" id="inputNote" placeholder="💬 한줄 메모 (치팅, 몸상태 등)" maxlength="100" />
        </div>
        <div class="error-msg hidden" id="mealError"></div>
        <button class="btn-primary" id="btnSave">저장하기</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
